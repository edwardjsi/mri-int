max_breakout_age_days:
  value: 3
  status: hypothesis
  introduced: 2026-07-08
  last_reviewed: 2026-07-08
  validated_after: null
  rationale: "Structure sub-gate requires breakout_age <= 3 (fresh continuations only)."
  journal_entry: null

# === V1.1d calibration override (Decision 102 Q2) ===

subscore.overhead_supply.max_count_for_100:
  value: 20
  status: validated
  introduced: 2026-07-08
  last_reviewed: 2026-07-08
  validated_after: null  # No outcomes yet — validated via distribution check
  rationale: "Raised from 10 to 20 to fix 83% saturation (V1.1d Gate 3). New saturation: 35.5% (target 20-40%)."
  journal_entry: "Calibration.md#2026-07-08-overhead-supply-max_count_for_100-raised-10-20"

# === V1.1c decision layer (Decision 101 expert feedback) ===

decision_layer.hysteresis_cas:
  value: 3.0
  status: hypothesis
  introduced: 2026-07-08
  last_reviewed: 2026-07-08
  validated_after: null
  rationale: "Tier-boundary hysteresis prevents flip-flopping on small CAS movements."
  journal_entry: null

decision_layer.min_deployable_cas:
  value: 70.0
  status: hypothesis
  introduced: 2026-07-08
  last_reviewed: 2026-07-08
  validated_after: null
  rationale: "Below this CAS, even eligible stocks don't justify deployment. Distinct from 'no eligible'."
  journal_entry: null

decision_layer.tier_thresholds:
  value: { WATCH: 60.0, FIRST_TRANCHE: 80.0, ADD_SECOND_TRANCHE: 85.0 }
  status: hypothesis
  introduced: 2026-07-08
  last_reviewed: 2026-07-08
  validated_after: null
  rationale: "Tier boundaries for action classification. Aligned with action.* thresholds."
  journal_entry: null

