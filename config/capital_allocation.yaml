# MRI Capital Allocation Score — Configuration
# Decision doc: docs/CAPITAL_ALLOCATION_SCORE_PLAN_2026-07-06.md
# Frozen 2026-07-06 (rev 2) per user spec. Edit here, not in code.
# Rev 2 changes: Market Score = 3 hard sub-gates (Trend/Breakout/Quality);
#   relaxed EMA stack; QIF >= 70; R/R removed (deferred to V1.1); Overhead Supply
#   added; Weekly Trend multi-component; Winner cap 1.10; Confidence stars added.

version: "1.0.0-rev3"

# ── Calibration Constants (rev 3) ────────────────────────────────────────────
# These are NOT architecture — they are tuning knobs. Move freely when backtests
# say so. Do NOT move the same constant into Python. Single source of truth:
# the YAML. Engine reads them via `load_config()['calibration']`.
#
# Hierarchy: Design Doc → YAML → Code → Sessions.md
# If a constant lives in Python, it's a bug. File an issue.
calibration:
  # Numeric thresholds used by the why-checklist and sub-score helpers.
  rs_strong: 0.05              # rs_90d >= this → "Strong RS" in why-checklist
  volume_confirmed: 1.5        # vol_ratio >= this → "Volume confirmed" line
  overhead_clear_air: 30       # overhead_supply_score <= this → "Clear overhead"
  qif_high: 70                 # qif_score >= this → "High QIF" line
  weekly_strong: 75            # weekly_trend_score >= this → "Weekly trend strengthening"
  near_52wh_pct: 5             # close >= (1 - pct/100) * 52w_high → "Near 52w high"
  breakout_early_max_age: 5    # breakout_age in [1, max] → "Early continuation"

  # Breakout AGE_DECAY table (Decision 099). Maps breakout_age → base sub-score.
  # A cliff exists at age 3→4 (85→70); indicator_freshness handles stability.
  age_decay:
    0: 100
    1: 95
    2: 90
    3: 85
    4: 70
    5: 65
    beyond: 40

  # Confidence star criteria (rev 3: 5 model-certainty dimensions).
  # All threshold tunables live here, NOT in the engine.
  confidence:
    complete_data_threshold_pct: 90     # data_completeness_pct >= this → star
    factor_agreement_max_std_dev: 20    # sub-score std-dev <= this → star
    # Stable calculations (Decision 101, expert Q5): replaced single cliff
    # at breakout_age=4 with transition zones. The current discontinuity is
    # "mathematically convenient but not how markets behave." A stock sitting
    # in the 'transition' or 'stale' zone produces scores at the noisy edge
    # of the AGE_DECAY table. The stable_calculations star fires ONLY for
    # ages in the 'excellent' or 'good' zones.
    breakout_age_zones:
      excellent: [0, 2]    # star fires
      good: [3, 3]         # star fires
      transition: [4, 5]   # star does NOT fire
      stale: [6, 999]      # star does NOT fire
    low_proxy_usage_max_proxies: 0      # proxies_used count <= this → star
    indicator_freshness_max_age_days: 5 # data_age_days <= this → star


# ── Stage 1: Eligibility Filter (pass/fail) ──────────────────────────────────
# If a stock fails ANY of these gates, it does NOT receive a Capital Allocation
# Score. Keeps the scoreboard focused on actionable candidates, not every stock.
eligibility:
  # Market Regime: BULLISH or SIDEWAYS pass; BEARISH passes only if
  # aggressive_mode is enabled (avoids swimming against the tide).
  allowed_regimes:
    - BULLISH
    - SIDEWAYS
  aggressive_mode: false

  # EMA Stack (RELAXED in rev 2 — see plan doc §2.2). All 4 conditions must hold.
  ema_conditions:  # all must be True
    close_gt_ema20: true
    ema20_gt_ema50: true
    ema50_gt_ema200: true
    ema100_rising: true  # slope(EMA100, 5d) > 0
  # Note: full strict stack (EMA20>50>100>200) was rejected because plenty of
  # fantastic reratings happen before EMA100 fully crosses.

  # Breakout: must be BROKEN_OUT state AND within N trading days of breakout.
  breakout_max_age_days: 5  # Breakout Today or Early Continuation (Day 0-5)

  # Liquidity: Average Daily Traded Value >= min_liquidity_crores × 1e7 INR.
  # ₹10 Cr/day matches Decision 029 (₹10 Cr ADTV Liquidity Gate).
  min_liquidity_crores: 10

  # Quality Score: QIF overall score (0-100) must be >= this threshold.
  # Rev 2: raised from 65 to 70. The point of MRI is fewer, better ideas.
  min_quality: 70

  # 52-Week Position: close must be within X% of the 52-week rolling high.
  max_distance_from_52wh_pct: 10

# ── Stage 2: Market Score Hard Sub-Gates (PASS/FAIL) ─────────────────────────
# NEW in rev 2: the Market Score is no longer a simple weighted sum. It has
# 3 hard PASS/FAIL sub-gates. Stocks that fail any sub-gate are REJECTED and
# receive no numeric score. This prevents a stock from compensating for a
# weak weekly trend with huge volume, etc.
#
# Only SURVIVORS (all 3 PASS) get the weighted Market Numeric Score computed.
market_subgates:
  trend:
    # "Trend PASS/FAIL" — weekly structure must be meaningfully bullish.
    # Threshold: weekly_trend_score >= 50 (i.e., at least half of the
    # HH/HL/EMA/52WH criteria pass — see weekly_trend subscore section).
    min_weekly_trend_score: 50
  breakout:
    # "Breakout PASS/FAIL" — stricter than eligibility: age <= 3 (early continuation).
    # Eligibility already requires age <= 5; the sub-gate further filters for
    # "fresh" rather than "early but not stale".
    max_breakout_age_days: 3
  quality:
    # "Quality PASS/FAIL" — stricter than eligibility: QIF >= 75.
    # Eligibility already requires QIF >= 70; the sub-gate enforces "high quality".
    min_quality: 75

# ── Stage 3: Market Numeric Score (for survivors) ───────────────────────────
# Weighted factors. Each sub-score is independently normalized to 0-100, then
# summed with these weights. Total weights (Market Score only) MUST sum to 100.
#
# Rev 2 changes:
#   - R/R REMOVED (deferred to V1.1 — proxy was too arbitrary)
#   - Overhead Supply ADDED (took R/R's old weight + small rebalance)
#   - Other factors slightly scaled up to sum to 100
weights:
  regime: 23      # Market Regime: BULLISH=100, SIDEWAYS=60, BEARISH=20
  weekly: 21      # Weekly Structure (multi-component: HH, HL, above EMAs, near 52w high)
  breakout: 17    # Breakout Quality: breakout_age + volume bonus
  overhead_supply: 14  # NEW: 0=clear air, 100=massive overhead resistance
  rs: 11          # Relative Strength: stock vs Nifty 50 over 90d
  volume: 8       # Volume Confirmation: volume vs 20d average
  sector: 6       # Sector Strength: industry RS-90d percentile
  # Concentration is NOT a Market Score weight — it's a portfolio multiplier (below).

# ── Stage 4: Portfolio Multipliers (applied to Market Numeric Score) ─────────
# Per user spec: portfolio context (existing winner, over-allocation) should be
# a MULTIPLIER, not a weight, so it reinforces the base signal rather than
# competing with it.
multiplier:
  winner:
    # profit_pct = (current_close - avg_cost) / avg_cost × 100
    # multiplier = 1 + (profit_pct / scale_pct) × max_boost, clamped
    # Rev 2: max_boost reduced from 0.15 to 0.10 (cap at +10%, not +15%)
    # Existing holdings should reinforce, not dominate rankings.
    scale_pct: 10
    max_boost: 0.10      # max +10% multiplier at or above scale_pct profit
    min_multiplier: 0.85 # floor (e.g. -10% loss → 0.90x; -15% loss → 0.85x clamped)
  concentration:
    # Penalize over-allocation. weight_pct = (current_value / total_capital) × 100.
    # multiplier = 1 - clamp(weight_pct / max_weight_pct, 0, 1) × max_penalty
    max_weight_pct: 15
    max_penalty: 0.10    # at 15% weight → 0.90x (max -10% penalty)

# ── Stage 5: Confidence (star rating, NOT a numeric) ─────────────────────────
# REV 3 (2026-07-07): Confidence is now a measure of MODEL CERTAINTY, not
# stock quality. The 5 stars depend on 5 binary model-certainty dimensions:
#   1. Complete data        — enough fields populated to compute reliably
#   2. Factor agreement     — sub-scores point the same direction
#   3. Stable calculations  — inputs aren't on cliffs or threshold boundaries
#   4. Low proxy usage      — real indicators preferred over placeholders
#   5. Indicator freshness  — inputs aren't stale
#
# Stock-quality signals (trend maturity, breakout maturity) intentionally
# removed — those belong in CAS itself, not in the model's certainty about
# its own score. They still appear in the why-checklist and breakout_age_emoji.
#
# Why stars (not numbers): users grasp "5 of 5 stars" faster than "92% confidence".
#
# Tunables (thresholds, ranges) live in `calibration.confidence` above.
# This section only declares WHICH criteria exist and their weights.
confidence:
  factors:
    complete_data:
      weight: 1
    factor_agreement:
      weight: 1
    stable_calculations:
      weight: 1
    low_proxy_usage:
      weight: 1
    indicator_freshness:
      weight: 1

# ── Sub-Score Normalization ──────────────────────────────────────────────────
subscore:
  regime:
    bullish: 100
    sideways: 60
    bearish: 20
  weekly:
    # Multi-component score (rev 2 upgrade). Sum of 5 binary components, max 100:
    #   +25 if Higher Highs confirmed (current swing high > previous)
    #   +25 if Higher Lows confirmed
    #   +20 if close > weekly EMA-13
    #   +15 if close > weekly EMA-20
    #   +15 if close >= 0.95 × rolling_high_52w (within 5% of 52w high)
    hh_weight: 25
    hl_weight: 25
    above_weekly_ema13_weight: 20
    above_weekly_ema20_weight: 15
    within_52wh_weight: 15
  breakout:
    # Score = base + volume_bonus, clamped to [0, 100]
    # base: 100 if age 0, decays via AGE_DECAY table (Decision 099)
    #   age 0 -> 100, age 1 -> 95, age 2 -> 90, age 3 -> 85, age 4 -> 70, age 5 -> 65, beyond -> 40
    volume_bonus_threshold: 2.0  # 2x avg volume
    volume_bonus_points: 10
  overhead_supply:
    # NEW rev 2. 0 = clear air, 100 = massive overhead resistance.
    # Compute: count distinct local swing highs in last 6m above current close,
    # weighted by recency and volume.
    lookback_days: 126  # ~6 months
    max_count_for_100: 10  # 10+ distinct overhead swing highs = max score
  rr:
    # NOT USED IN V1.0 — rev 2 removed the proxy. Configured here for V1.1
    # readiness when a real `support_3m` column ships.
    rr_at_zero: 1.0
    rr_at_100: 4.0
    enabled_v1: false
  rs:
    # Score = clamp((rs_90d - 0) / 0.10 × 100, 0, 100) — 100 = Nifty +10% over 90d
  volume:
    # Score = 100 × clamp((volume / avg_volume_20d - 1.0) / 2.0, 0, 1)
    # 100 = 3× average, 0 = at or below average
    vol_ratio_for_100: 3.0
  sector:
    # V1.0: proxy = 50 for all (real sector RS lands in V1.2 via sector_rs_60d).
    proxy_score_v1: 50

# ── Stage 6: Action Chip Thresholds ──────────────────────────────────────────
actions:
  add_second_tranche: 85   # >= 85 -> "ADD SECOND TRANCHE"
  first_tranche: 70        # 70-84  -> "FIRST TRANCHE"
  watch: 50                # 50-69  -> "WATCH"
  # < 50 -> no chip (stock didn't make the banner)

# ── Breakout Age UI Emoji (rev 2) ────────────────────────────────────────────
# Surfaced in the UI so users understand urgency at a glance.
breakout_age_emoji:
  0: "🔥"  # Today
  1: "🟢"  # Yesterday
  2: "🟢"  # 2 Days
  3: "🟡"  # 3 Days
  4: "🟡"  # 4 Days
  5: "⚪"  # 5 Days

# ── Why Templates (rev 2: structured checklist, not single sentence) ─────────
# Each entry is (condition_name, template_string). The renderer evaluates
# each condition against the row + sub-scores and appends matching lines.
why_templates:
  - condition: regime_strong
    template: "✓ Strong market regime ({regime_label})"
  - condition: weekly_strong
    template: "✓ Weekly trend strengthening (HH + HL)"
  - condition: breakout_today
    template: "✓ Fresh breakout today (Day 0)"
  - condition: breakout_early
    template: "✓ Early continuation (Day {breakout_age})"
  - condition: near_52wh
    template: "✓ Near 52-week high"
  - condition: rs_strong
    template: "✓ Strong RS (top quartile)"
  - condition: volume_confirmed
    template: "✓ Volume confirmation ({vol_ratio:.1f}x average)"
  - condition: winner_profit
    template: "✓ Existing winner (+{profit_pct:.0f}%)"
  - condition: clear_overhead
    template: "✓ Clear overhead supply (score {overhead_supply_score}/100)"
  - condition: high_quality
    template: "✓ High QIF ({qif_score:.0f}/100)"

# ----------------------------------------------------------------------------
# CAS V1.1b (Decision 101) — Action verb thresholds (Layer 3 vocabulary)
# ----------------------------------------------------------------------------
# These thresholds map (CAS, confidence_stars, position state) → action verb.
# BUY  = first tranche / fresh position
# ADD  = adding to existing position
# WATCH = eligible but no action yet
# (NO_ACTION is not persisted — every recommendation has an action verb.)
action:
  buy_cas_min: 80                  # CAS >= this AND stars >= min → BUY (no position)
  add_cas_min: 85                  # CAS >= this AND stars >= min → ADD (existing position)
  watch_cas_min: 60                # CAS >= this → WATCH (eligible but no action)
  min_confidence_stars_for_buy: 4  # Even high CAS with low stars → WATCH


# ----------------------------------------------------------------------------
# CAS V1.1c (Decision 101) — Decision Layer (Action Lifecycle)
# ----------------------------------------------------------------------------
# The Decision Layer wraps the CAS engine with three concerns:
#   1. Tier-based action hysteresis (prevents flip-flopping around tier boundaries)
#   2. NO_ACTION triggers (when to recommend NOT deploying capital)
#   3. Recommendation lifecycle (NEW → ACTIVE → MATURED → ARCHIVED)
#
# Design philosophy: "A recommendation is a scientific hypothesis.
# Calibration is the process of proving or disproving it using observed outcomes."
#
# See config/calibration_registry.yaml for the validation status of each
# assumption. Calibration Debt = number of unvalidated entries.
decision_layer:
  # Hysteresis: dampen both upgrades and downgrades near tier boundaries.
  # An upgrade to tier T is only applied if current_cas >= T_threshold + hysteresis.
  # A downgrade to tier T is only applied if current_cas < T_threshold - hysteresis.
  hysteresis_cas: 3.0

  # Tier CAS thresholds (lower bound of each tier). Tiers are inclusive at
  # the lower bound, exclusive at the upper bound (except the top tier).
  tier_thresholds:
    WATCH: 60.0
    FIRST_TRANCHE: 80.0
    ADD_SECOND_TRANCHE: 85.0

  # Minimum Deployable Score: if the BEST eligible stock's CAS is below this,
  # the engine returns NO_ACTION with reason "BELOW_DEPLOYMENT_THRESHOLD".
  # Different from "no eligible stocks" — that means no opportunities passed
  # the gates at all. This means opportunities exist but none are good enough
  # to deploy capital against. The market condition is fundamentally different.
  min_deployable_cas: 70.0

  # Recommendation Lifecycle: when does a recommendation transition states?
  #   NEW      → created today (age == 0 days)
  #   ACTIVE   → past creation, milestones still being filled
  #   MATURED  → all 5 milestones filled (w1, w2, w4, m3, m6)
  #   ARCHIVED → MATURED + age > archive_age_days (kept for historical analysis)
  lifecycle:
    archive_age_days: 180
    required_milestones:  # all must be filled for MATURED
      - w1
      - w2
      - w4
      - m3
      - m6

# ----------------------------------------------------------------------------
# CAS V1.1d (Decision 101) — Regression Tolerance
# ----------------------------------------------------------------------------
# When tuning weights/thresholds (not refactoring logic), allow ±2 points
# of CAS drift in regression tests via assert_cas_within_tolerance().
# This prevents test fatigue from chasing ±0.5 point changes that don't
# change real behavior. If a tuning change moves CAS by >2 points, that
# is a SIGNAL — review the calibration journal.
regression_tolerance:
  cas_points: 2.0   # ±2 points CAS drift acceptable when tuning
  stars: 0          # stars must be exact (no drift allowed)
