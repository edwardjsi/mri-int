# Regression Basket — Capital Allocation Score V1.0 (rev 3)
#
# Curated scenarios that exercise the full CAS pipeline (eligibility →
# structure → market score → CAS → confidence → why-checklist). Every future
# tuning of weights, thresholds, or formulas should pass these scenarios
# unchanged. If a scenario starts failing, either:
#   (a) The tuning was too aggressive — revisit the change.
#   (b) The business intent has changed — update the YAML AND Decisions.md.
#
# Schema per scenario:
#   name:            unique identifier (becomes pytest test name)
#   description:     human-readable context (the "why")
#   row:             full row dict passed to the engine (all gates + sub-scores)
#   regime:          "BULLISH" | "SIDEWAYS" | "BEARISH"
#   winner_profit_pct:    optional; omit for non-portfolio scenarios
#   concentration_weight_pct: optional; omit for non-portfolio scenarios
#   proxies_used:    {factor_name: bool} — True means proxy was used for that factor
#   expected:
#     eligible:               bool — passed all 8 eligibility gates
#     structure_passed:       bool — passed all 3 structure dimensions
#     eligible_failed_contains: list of gate names that MUST appear in failed
#     structure_failed_contains: list of structure dims that MUST appear in failed
#     market_score_gte:       float — market score must be ≥ this
#     market_score_lte:       float — market score must be ≤ this
#     cas_gte:                float — CAS must be ≥ this
#     cas_lte:                float — CAS must be ≤ this
#     confidence_gte:         int — confidence stars must be ≥ this
#     confidence_lte:         int — confidence stars must be ≤ this
#     why_contains:           list of substrings that MUST appear in why-checklist
#     why_not_contains:       list of substrings that MUST NOT appear

- name: WELCORP_existing_winner
  description: |
    Existing winner with significant unrealized profit (~25%). The CAS should be
    boosted by the winner multiplier (1.10× cap). Should pass everything.
  row:
    close: 450.0
    ema_20: 420.0
    ema_50: 400.0
    ema_200: 350.0
    ema_100_slope_5d: 1.2
    volume: 3_000_000
    avg_volume_20d: 2_000_000
    rolling_high_52w: 460.0
    weekly_ema13: 410.0
    weekly_ema20: 390.0
    hh_confirmed: true
    hl_confirmed: true
    weekly_trend_score: 85
    breakout_state: BROKEN_OUT
    breakout_age: 3
    rs_90d: 0.08
    overhead_supply_score: 25
    qif_score: 82
    data_completeness_pct: 95
    data_age_days: 1
    winner_profit_pct: 25.0
    concentration_weight_pct: 4.0
  regime: BULLISH
  proxies_used:
    sector: false
    rr: false
  expected:
    eligible: true
    structure_passed: true
    market_score_gte: 75
    cas_gte: 75  # winner (1.10) × concentration (~0.97) ≈ 1.07 boost
    confidence_gte: 4  # high data completeness + freshness + low proxy + agreement
    why_contains:
      - "Existing winner"
      - "Clear overhead supply"
      - "High QIF"

